[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

# PlatformIO's default source directory is already firmware/src.
build_src_filter = +<*>

# Include paths for HAL/CMSIS headers in the repo
build_flags =
  -IDrivers/STM32F1xx_HAL_Driver/Inc
  -IDrivers/CMSIS/Include
  -DSTM32F103xB
  -DLAB_TX_STALE_REPLAY_ON_BOOT=0

upload_protocol = stlink
upload_speed = 115200
monitor_speed = 115200
